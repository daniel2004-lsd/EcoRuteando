<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoRuteando</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Times+New+Roman:ital,wght@0,400;0,700;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --eco-dark:    #2c5f3f;
      --eco-mid:     #3d7a55;
      --eco-main:    #4a8f65;
      --eco-light:   #5ea87a;
      --eco-soft:    #cde4d5;
      --eco-pale:    #f2f8f4;
      --eco-bg:      #e8f3ec;
      --ivory:       #f9f6f0;
      --ivory-dark:  #ede8df;
    }
    * { font-family: 'Playfair Display', 'Times New Roman', serif; }
    html { scroll-behavior: smooth; }

    /* ── GRADIENTS ── */
    .gradient-hero { background: linear-gradient(150deg, #3d6b4f 0%, #4e8866 40%, #5ea87a 100%); }
    .gradient-card { background: linear-gradient(145deg, #ffffff 0%, var(--ivory) 100%); }

    /* ── INPUTS ── */
    .input-eco {
      background: #e8f0eb;
      border: 2px solid transparent;
      transition: all 0.25s;
      font-family: 'Playfair Display', serif;
    }
    .input-eco:focus {
      background: #dce8e0;
      border-color: var(--eco-main);
      outline: none;
      box-shadow: 0 0 0 3px rgba(74,143,101,0.18);
    }
    .input-eco.input-error {
      border-color: #dc2626 !important;
      background: #fee2e2;
    }
    .input-eco.input-ok {
      border-color: #16a34a !important;
    }

    /* ── BUTTONS ── */
    .btn-primary {
      background: linear-gradient(135deg, var(--eco-dark), var(--eco-main));
      transition: all 0.22s;
      font-family: 'Playfair Display', serif;
    }
    .btn-primary:hover:not(:disabled) {
      background: linear-gradient(135deg, #143d28, #256b4a);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(30,74,50,0.38);
    }
    .btn-outline { border: 2px solid var(--eco-main); color: var(--eco-main); transition: all 0.22s; }
    .btn-outline:hover { background: var(--eco-main); color: white; }

    /* ── CARDS ── */
    .card-hover { transition: all 0.3s; }
    .card-hover:hover { transform: translateY(-5px); box-shadow: 0 22px 45px rgba(30,74,50,0.13); }

    /* ── ANIMATIONS ── */
    .animate-fade-in { animation: fadeIn 0.45s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .animate-slide-up { animation: slideUp 0.5s ease forwards; }
    @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
    .animate-pulse-green { animation: pulseGreen 2s infinite; }
    @keyframes pulseGreen { 0%,100% { box-shadow: 0 0 0 0 rgba(46,125,82,0.4); } 50% { box-shadow: 0 0 0 10px rgba(46,125,82,0); } }

    /* ── LOGO / MISC ── */
    .logo-circle { background: linear-gradient(135deg, var(--eco-dark), var(--eco-light)); }
    .feature-icon { background: linear-gradient(135deg, var(--ivory), var(--ivory-dark)); }
    .social-btn { border: 1.5px solid #d1d5db; transition: all 0.2s; }
    .social-btn:hover { border-color: var(--eco-main); background: var(--ivory); }

    /* ── VERIFY INPUTS ── */
    .verify-input {
      width: 46px; height: 56px; text-align: center; font-size: 1.3rem;
      font-weight: 700; background: var(--ivory); border: 2px solid var(--ivory-dark);
      border-radius: 12px; color: var(--eco-dark); transition: all 0.2s;
      font-family: 'Playfair Display', serif;
    }
    .verify-input:focus { border-color: var(--eco-main); background: #dce8e0; outline: none; box-shadow: 0 0 0 3px rgba(74,143,101,0.2); }

    /* ── PROGRESS STEPS ── */
    .progress-step { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 700; }
    .step-active { background: linear-gradient(135deg, var(--eco-dark), var(--eco-main)); color: white; }
    .step-done { background: var(--eco-light); color: white; }
    .step-pending { background: #d4ead9; color: #8db09a; }
    .step-line { height: 2px; flex: 1; background: #d4ead9; }
    .step-line-done { background: var(--eco-light); }

    /* ── PASSWORD STRENGTH ── */
    .strength-bar { height: 5px; border-radius: 3px; transition: all 0.3s; }

    /* ── TAGS ── */
    .tag-eco { background: linear-gradient(135deg, #c5e8d4, #a8d9bc); color: var(--eco-dark); font-size: 0.72rem; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: 0.02em; }

    /* ── MODAL OVERLAY ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 1rem; animation: fadeIn 0.2s ease; }
    .modal-box { background: white; border-radius: 24px; max-width: 560px; width: 100%; max-height: 82vh; overflow-y: auto; padding: 2rem; box-shadow: 0 30px 80px rgba(0,0,0,0.25); position: relative; }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--eco-dark); color: white; padding: 12px 24px; border-radius: 50px; font-size: 0.88rem; font-weight: 600; z-index: 9999; animation: toastIn 0.3s ease; white-space: nowrap; box-shadow: 0 6px 24px rgba(0,0,0,0.25); }
    @keyframes toastIn { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }

    /* ── FLOATING PARTICLES (hero) ── */
    .particle { position: absolute; border-radius: 50%; pointer-events: none; animation: float linear infinite; opacity: 0.18; }
    @keyframes float { 0% { transform: translateY(0) rotate(0deg); } 100% { transform: translateY(-120px) rotate(360deg); } }

    /* ── ERROR TEXT ── */
    .err-msg { font-size: 0.75rem; color: #dc2626; font-weight: 600; margin-top: 4px; display: flex; align-items: center; gap: 4px; }
    .ok-msg  { font-size: 0.75rem; color: #16a34a; font-weight: 600; margin-top: 4px; }

    /* ── COUNTER BADGE ── */
    .stat-badge { background: white; border-radius: 16px; padding: 10px 18px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); text-align: center; }

    /* ── NAV ── */
    .nav-link { position: relative; }
    .nav-link::after { content:''; position:absolute; bottom:-4px; left:0; width:0; height:2px; background:var(--eco-light); transition: width 0.25s; border-radius:2px; }
    .nav-link:hover::after { width:100%; }

    /* ── SCROLLBAR ── */
    .modal-box::-webkit-scrollbar { width: 6px; }
    .modal-box::-webkit-scrollbar-thumb { background: var(--eco-soft); border-radius: 3px; }
  </style>
</head>

const Toast = ({msg, onDone}) => {
  useEffect(() => { const t = setTimeout(onDone, 2800); return ()=>clearTimeout(t); }, []);
  return <div className="toast">✓ {msg}</div>;
};

// ─── ANIMATED COUNTER ────────────────────────────────────────────────────────
const AnimatedCounter = ({target, suffix=""}) => {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const obs = new IntersectionObserver(([e]) => {
      if(e.isIntersecting) {
        let start=0; const step = target/60;
        const t = setInterval(()=>{ start+=step; if(start>=target){setVal(target);clearInterval(t);}else setVal(Math.floor(start)); },20);
      }
    }, {threshold:0.5});
    if(ref.current) obs.observe(ref.current);
    return ()=>obs.disconnect();
  }, [target]);
  return <span ref={ref}>{val.toLocaleString()}{suffix}</span>;
};

        <div className="max-w-2xl mx-auto">
          <h2 className="text-3xl md:text-4xl font-bold text-white mb-4">Comienza tu viaje sostenible hoy</h2>
          <p className="text-green-100 mb-8 text-lg">Regístrate gratis y descubre cómo EcoRuteando puede transformar tu forma de moverte por la ciudad.</p>
          <button onClick={()=>navigate("register")} className="bg-white text-green-900 px-10 py-4 rounded-2xl font-bold text-lg shadow-xl hover:-translate-y-1 hover:shadow-2xl transition-all">
            Únete a la revolución verde 🌿
          </button>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="bg-green-950 text-green-200 py-10 px-6 text-center text-sm">
        <div className="flex items-center justify-center gap-2 mb-3">
          <img src={LEAF_IMG} alt="hoja" style={{width:"22px", height:"22px", objectFit:"contain", mixBlendMode:"screen", opacity:0.9}}/>
          <span className="font-bold text-white">EcoRuteando</span>
        </div>
        <p className="mb-2">© 2025 EcoRuteando — SENA · Programa Desarrollo de Software · Neiva, Colombia</p>
        <div className="flex justify-center gap-4 mt-3 text-green-400 text-xs">
          <button className="hover:text-white transition-colors">Política de Privacidad</button>
          <span>·</span>
          <button className="hover:text-white transition-colors">Términos de Uso</button>
          <span>·</span>
          <button className="hover:text-white transition-colors">Contacto</button>

// ─── LOGIN ────────────────────────────────────────────────────────────────────
const Login = ({navigate}) => {
  const [email,setEmail]    = useState("");
  const [pw,setPw]          = useState("");
  const [showPw,setShowPw]  = useState(false);
  const [loading,setLoading]= useState(false);
  const [errors,setErrors]  = useState({});
  const [toast,setToast]    = useState(null);

  const validate = () => {
    const e={};
    if(!email)             e.email="El correo es obligatorio.";
    else if(!validateEmail(email)) e.email="Ingresa un correo válido (ej: usuario@correo.com).";
    if(!pw)                e.pw="La contraseña es obligatoria.";
    else if(pw.length<8)   e.pw="La contraseña debe tener al menos 8 caracteres.";
    return e;
  };

  const handleLogin = () => {
    const e=validate();
    setErrors(e);
    if(Object.keys(e).length>0) return;
    setLoading(true);
    setTimeout(()=>{ setLoading(false); navigate("landing"); },1400);
  };

  return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 py-10 animate-fade-in">
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
      <button onClick={()=>navigate("landing")} className="absolute top-6 right-6 flex items-center gap-1 text-gray-500 hover:text-green-800 text-sm font-medium transition-colors">
        <ArrowLeft/> Volver
      </button>
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-green-50 animate-slide-up">
        <h2 className="text-2xl font-bold text-green-900 mb-1">Iniciar sesión</h2>
        <p className="text-gray-500 text-sm mb-6">Bienvenido de vuelta a EcoRuteando.</p>
        <div className="space-y-4">
          <InputField
            label="Correo electrónico" type="email" placeholder="tucorreo@email.com"
            value={email} onChange={e=>{setEmail(e.target.value);setErrors({...errors,email:""});}}
            error={errors.email} success={email&&!errors.email&&validateEmail(email)?"Correo válido":""}
          />
          <InputField
            label="Contraseña" showToggle showPw={showPw} onToggle={()=>setShowPw(!showPw)}
            value={pw} onChange={e=>{setPw(e.target.value);setErrors({...errors,pw:""});}}
            placeholder="Mín. 8 caracteres"
            error={errors.pw}
          />
          <div className="text-right">
            <button onClick={()=>navigate("recover")} className="text-green-700 text-sm font-semibold hover:text-green-900 transition-colors">¿Olvidaste tu contraseña?</button>
          </div>
          <button onClick={handleLogin} disabled={loading} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold text-base shadow-md disabled:opacity-70">
            {loading ? (
              <span className="flex items-center justify-center gap-2">
                <svg className="animate-spin w-4 h-4" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="white" strokeWidth="3" opacity="0.3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="white" strokeWidth="3" strokeLinecap="round"/></svg>
                Entrando...
              </span>
            ) : "Iniciar sesión"}
          </button>
          <SocialButtons/>
        </div>
        <p className="text-center text-sm text-gray-500 mt-6">
          ¿No tienes cuenta? <button onClick={()=>navigate("register")} className="text-green-700 font-bold hover:text-green-900">Regístrate aquí.</button>
        </p>
      </div>
    </div>
  );
};

// ─── REGISTER ────────────────────────────────────────────────────────────────
const Register = ({navigate}) => {
  const [form,setForm]       = useState({name:"",email:"",pw:"",pw2:""});
  const [showPw,setShowPw]   = useState(false);
  const [accepted,setAccepted]= useState(false);
  const [loading,setLoading] = useState(false);
  const [errors,setErrors]   = useState({});
  const [showTerms,setShowTerms]= useState(false);
  const [toast,setToast]     = useState(null);

  const pwStrength = form.pw.length===0?0:form.pw.length<6?1:form.pw.length<10?2:(/[A-Z]/.test(form.pw)&&/[0-9]/.test(form.pw))?4:3;
  const strengthColors = ["bg-gray-200","bg-red-400","bg-yellow-400","bg-green-500","bg-emerald-600"];
  const strengthLabels = ["","Muy débil","Media","Fuerte","Muy fuerte"];
  const strengthClass  = ["","text-red-500","text-yellow-600","text-green-600","text-emerald-600"];

  const validate = () => {
    const e={};
    if(!form.name)                e.name="El nombre es obligatorio.";
    else if(!validateName(form.name)) e.name="Ingresa al menos 2 caracteres.";
    if(!form.email)               e.email="El correo es obligatorio.";
    else if(!validateEmail(form.email)) e.email="Ingresa un correo válido (ej: usuario@correo.com).";
    if(!form.pw)                  e.pw="La contraseña es obligatoria.";
    else if(!validatePw(form.pw)) e.pw="La contraseña debe tener al menos 8 caracteres.";
    if(!form.pw2)                 e.pw2="Confirma tu contraseña.";
    else if(form.pw!==form.pw2)   e.pw2="Las contraseñas no coinciden.";
    if(!accepted)                 e.terms="Debes aceptar los términos y condiciones.";
    return e;
  };

  const handleRegister = () => {
    const e=validate();
    setErrors(e);
    if(Object.keys(e).length>0) return;
    setLoading(true);
    setTimeout(()=>{ setLoading(false); setToast("Cuenta creada exitosamente"); setTimeout(()=>navigate("login"),2200); },1400);
  };

  const f = (k,v) => { setForm({...form,[k]:v}); setErrors({...errors,[k]:""}); };

  return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 py-10 animate-fade-in">
      {toast && <Toast msg={toast} onDone={()=>setToast(null)}/>}
      {showTerms && <TermsModal onClose={()=>setShowTerms(false)} onAccept={()=>{setAccepted(true);setShowTerms(false);setErrors({...errors,terms:""}); }}/>}
      <button onClick={()=>navigate("landing")} className="absolute top-6 right-6 flex items-center gap-1 text-gray-500 hover:text-green-800 text-sm font-medium transition-colors">
        <ArrowLeft/> Volver
      </button>
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-green-50 animate-slide-up">
        <h2 className="text-2xl font-bold text-green-900 mb-1">Crear Cuenta</h2>
        <p className="text-gray-500 text-sm mb-6">Únete a la comunidad de movilidad sostenible</p>
        <div className="space-y-4">
          <InputField
            label="Nombre completo" placeholder="Tu nombre" value={form.name}
            onChange={e=>f("name",e.target.value)} error={errors.name}
            success={form.name&&!errors.name&&validateName(form.name)?"Nombre válido":""}
          />
          <InputField
            label="Correo electrónico" type="email" placeholder="tucorreo@email.com"
            value={form.email} onChange={e=>f("email",e.target.value)} error={errors.email}
            success={form.email&&!errors.email&&validateEmail(form.email)?"Correo válido":""}
          />
          <div>
            <InputField
              label="Contraseña" showToggle showPw={showPw} onToggle={()=>setShowPw(!showPw)}
              value={form.pw} onChange={e=>f("pw",e.target.value)}
              placeholder="Mín. 8 caracteres" error={errors.pw}
              hint="Usa mayúsculas y números para mayor seguridad"
            />
            {form.pw && (
              <div className="mt-2">
                <div className="flex gap-1 mb-1">
                  {[1,2,3,4].map(i=><div key={i} className={`strength-bar flex-1 ${i<=pwStrength?strengthColors[pwStrength]:"bg-gray-200"}`}/>)}
                </div>
                <p className={`text-xs font-semibold ${strengthClass[pwStrength]}`}>{strengthLabels[pwStrength]}</p>
              </div>
            )}
          </div>
          <InputField
            label="Confirmar contraseña" type="password" placeholder="Repite tu contraseña"
            value={form.pw2} onChange={e=>f("pw2",e.target.value)} error={errors.pw2}
            success={form.pw2&&!errors.pw2&&form.pw===form.pw2&&form.pw2.length>0?"Las contraseñas coinciden":""}
          />
          <div>
            <label className="flex items-start gap-2.5 cursor-pointer group">
              <div onClick={()=>{setAccepted(!accepted);setErrors({...errors,terms:""}); }} className={`w-5 h-5 rounded-md border-2 flex items-center justify-center flex-shrink-0 mt-0.5 transition-all ${accepted?"bg-green-600 border-green-600":"border-gray-300 group-hover:border-green-400"}`}>
                {accepted && <span className="text-white text-xs font-bold">✓</span>}
              </div>
              <span className="text-sm text-gray-600">
                Acepto los{" "}
                <button type="button" onClick={()=>setShowTerms(true)} className="text-green-700 font-semibold hover:underline">términos y condiciones</button>
              </span>
            </label>
            {errors.terms && <p className="err-msg mt-1">⚠ {errors.terms}</p>}
          </div>
          <button onClick={handleRegister} disabled={loading} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold text-base shadow-md disabled:opacity-50">
            {loading?"Creando cuenta...":"Crear cuenta"}
          </button>
          <SocialButtons/>
        </div>
        <p className="text-center text-sm text-gray-500 mt-6">
          ¿Ya tienes cuenta? <button onClick={()=>navigate("login")} className="text-green-700 font-bold hover:text-green-900">Iniciar sesión</button>
        </p>
      </div>
    </div>
  );
};

// ─── RECOVER ─────────────────────────────────────────────────────────────────
const Recover = ({navigate}) => {
  const [email,setEmail] = useState("");
  const [sent,setSent]   = useState(false);
  const [error,setError] = useState("");

  const handleSend = () => {
    if(!email) { setError("El correo es obligatorio."); return; }
    if(!validateEmail(email)) { setError("Ingresa un correo válido (ej: usuario@correo.com)."); return; }
    setError("");
    setSent(true);
  };

  if(sent) return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 animate-fade-in">
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 text-center border border-green-50">
        <div className="w-16 h-16 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-5"><MailIcon/></div>
        <h2 className="text-xl font-bold text-green-900 mb-3">Revisa tu correo</h2>
        <p className="text-gray-500 text-sm leading-relaxed mb-2">
          Hemos enviado un enlace de verificación a:
        </p>
        <p className="text-green-800 font-bold text-base mb-5 break-all">{email}</p>
        <p className="text-gray-400 text-xs mb-6">Revisa tu bandeja de entrada y sigue las instrucciones para restablecer tu contraseña.</p>
        <button onClick={()=>navigate("verify")} className="btn-primary w-full text-white py-3 rounded-xl font-bold text-sm mb-3">
          Ya tengo el código →
        </button>
        <button onClick={()=>setSent(false)} className="text-green-700 text-sm font-semibold hover:text-green-900 transition-colors block mx-auto mb-2">
          ¿Correo incorrecto? Cambiarlo
        </button>
        <button onClick={()=>navigate("login")} className="flex items-center gap-1 text-gray-400 text-sm font-medium mx-auto hover:text-gray-600 transition-colors w-fit">
          <ArrowLeft/> Volver al inicio de sesión
        </button>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 animate-fade-in">
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-green-50">
        <div className="text-center mb-6">
          <h2 className="text-xl font-bold text-green-900 mb-2">Recuperar contraseña</h2>
          <div className="w-14 h-14 bg-green-50 rounded-full flex items-center justify-center mx-auto mt-4"><MailIcon/></div>
        </div>
        <p className="text-gray-500 text-sm text-center mb-6">Ingresa tu correo electrónico y te enviaremos un código de verificación para restablecer tu contraseña.</p>
        <div className="space-y-4">
          <InputField
            label="Correo electrónico" type="email" placeholder="tucorreo@email.com"
            value={email} onChange={e=>{setEmail(e.target.value);setError("");}}
            error={error}
            success={email&&!error&&validateEmail(email)?"Correo válido":""}
          />
          <button onClick={handleSend} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold">Enviar código</button>
        </div>
        <button onClick={()=>navigate("login")} className="flex items-center gap-1 text-green-700 text-sm font-semibold mt-5 mx-auto hover:text-green-900 w-fit">
          <ArrowLeft/> Volver al inicio de sesión
        </button>
      </div>
    </div>
  );
};

// ─── VERIFY CODE ─────────────────────────────────────────────────────────────
const VerifyCode = ({navigate}) => {
  const [code,setCode]   = useState(["","","","","",""]);
  const [error,setError] = useState("");
  const inputs = useRef([]);

  const handleChange = (val,idx) => {
    if(!/^[0-9]?$/.test(val)) return;
    const next=[...code]; next[idx]=val; setCode(next); setError("");
    if(val && idx<5) inputs.current[idx+1]?.focus();
  };
  const handleKey = (e,idx) => {
    if(e.key==="Backspace"&&!code[idx]&&idx>0) inputs.current[idx-1]?.focus();
  };
  const filled = code.every(c=>c!=="");

  const handleVerify = () => {
    if(!filled) { setError("Completa los 6 dígitos del código."); return; }
    navigate("newpassword");
  };

  return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 animate-fade-in">
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-green-50">
        <ProgressSteps current={1}/>
        <div className="text-center mb-6">
          <div className="w-14 h-14 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-4"><ShieldIcon/></div>
          <h2 className="text-xl font-bold text-green-900 mb-2">Verificar código</h2>
          <p className="text-gray-500 text-sm">Hemos enviado un código de 6 dígitos a tu correo registrado.</p>
        </div>
        <div className="flex gap-2 justify-center mb-3">
          {code.map((v,i)=>(
            <input key={i} ref={el=>inputs.current[i]=el} className="verify-input"
              maxLength={1} value={v}
              onChange={e=>handleChange(e.target.value,i)}
              onKeyDown={e=>handleKey(e,i)}
            />
          ))}
        </div>
        {error && <p className="err-msg justify-center mb-3">⚠ {error}</p>}
        <p className="text-center text-sm text-gray-500 mb-5">
          ¿No recibiste el código? <button className="text-green-700 font-semibold hover:text-green-900">Reenviar</button>
        </p>
        <button onClick={handleVerify} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold disabled:opacity-50">
          Verificar código
        </button>
        <button onClick={()=>navigate("recover")} className="flex items-center gap-1 text-green-700 text-sm font-semibold mt-4 mx-auto hover:text-green-900 w-fit">
          <ArrowLeft/> Volver
        </button>
      </div>
    </div>
  );
};

// ─── NEW PASSWORD ─────────────────────────────────────────────────────────────
const NewPassword = ({navigate}) => {
  const [pw,setPw]       = useState("");
  const [pw2,setPw2]     = useState("");
  const [showPw,setShowPw]= useState(false);
  const [errors,setErrors]= useState({});
  const [success,setSuccess]= useState(false);

  const validate = () => {
    const e={};
    if(!pw)            e.pw="Ingresa tu nueva contraseña.";
    else if(pw.length<8) e.pw="La contraseña debe tener al menos 8 caracteres.";
    if(!pw2)           e.pw2="Confirma la contraseña.";
    else if(pw!==pw2)  e.pw2="Las contraseñas no coinciden.";
    return e;
  };

  const handleSubmit = () => {
    const e=validate();
    setErrors(e);
    if(Object.keys(e).length>0) return;
    setSuccess(true);
  };

  if(success) return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 animate-fade-in">
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 text-center border border-green-50">
        <div className="flex justify-center mb-5"><CheckCircle/></div>
        <h2 className="text-xl font-bold text-green-900 mb-3">¡Contraseña actualizada!</h2>
        <p className="text-gray-500 text-sm mb-6">Tu contraseña ha sido restablecida exitosamente. Ya puedes iniciar sesión con tu nueva contraseña.</p>
        <button onClick={()=>navigate("login")} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold">Iniciar sesión</button>
      </div>
    </div>
  );

  return (
    <div className="min-h-screen bg-[#edf4ef] flex flex-col items-center justify-center px-4 animate-fade-in">
      <div className="mb-8"><Logo size="md"/></div>
      <div className="w-full max-w-sm bg-white rounded-3xl shadow-xl p-8 border border-green-50">
        <ProgressSteps current={2}/>
        <div className="text-center mb-6">
          <div className="w-14 h-14 bg-green-50 rounded-full flex items-center justify-center mx-auto mb-3"><KeyIcon/></div>
          <h2 className="text-xl font-bold text-green-900 mb-2">Nueva contraseña</h2>
          <p className="text-gray-500 text-sm">Elige una contraseña segura para proteger tu cuenta.</p>
        </div>
        <div className="space-y-4">
          <InputField
            label="Nueva contraseña" showToggle showPw={showPw} onToggle={()=>setShowPw(!showPw)}
            value={pw} onChange={e=>{setPw(e.target.value);setErrors({...errors,pw:""});}}
            placeholder="Mín. 8 caracteres" error={errors.pw}
            hint="Usa mayúsculas y números"
          />
          <InputField
            label="Confirmar nueva contraseña" type="password"
            value={pw2} onChange={e=>{setPw2(e.target.value);setErrors({...errors,pw2:""});}}
            placeholder="Repite tu contraseña" error={errors.pw2}
            success={pw2&&!errors.pw2&&pw===pw2&&pw2.length>0?"Las contraseñas coinciden":""}
          />
          <button onClick={handleSubmit} className="btn-primary w-full text-white py-3.5 rounded-xl font-bold">
            Restablecer contraseña
          </button>
        </div>
      </div>
    </div>
  );
};

// ─── APP ─────────────────────────────────────────────────────────────────────
const App = () => {
  const [page,setPage] = useState("landing");
  const navigate = (p) => { setPage(p); window.scrollTo(0,0); };
  const pages = {
    landing:    <Landing     navigate={navigate}/>,
    login:      <Login       navigate={navigate}/>,
    register:   <Register    navigate={navigate}/>,
    recover:    <Recover     navigate={navigate}/>,
    verify:     <VerifyCode  navigate={navigate}/>,
    newpassword:<NewPassword navigate={navigate}/>,
  };
  return pages[page] || pages.landing;
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

<div id="root"></div>
</body>
</html>
