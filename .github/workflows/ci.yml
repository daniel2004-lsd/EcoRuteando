name: Validar Proyecto

on:
  pull_request:
    branches: [ develop, qa, main ]
  push:
    branches: [ develop, qa, main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: front-end/ecoRuteando-react/package-lock.json

      - name: Instalar dependencias
        working-directory: front-end/ecoRuteando-react
        run: npm ci --ignore-scripts

      - name: Ejecutar Linting (H-09)
        working-directory: front-end/ecoRuteando-react
        run: npm run lint

      - name: Ejecutar Pruebas Automatizadas (H-09)
        working-directory: front-end/ecoRuteando-react
        run: npm test

      - name: Build del proyecto
        working-directory: front-end/ecoRuteando-react
        run: npm run build
